# Cloud Run settings (non-secret). Copy to deploy/env.yaml (git-ignored) and fill in.
# Secrets (API key, session secret, cron secret, internal terms, sign-in tokens) come from
# Secret Manager; see docs/deploy-gcp.md.
PROVIDER: "anthropic"                    # claude_code can't run on Cloud Run (personal subscription)
CLAUDE_MODEL: "claude-opus-5-5"
CLAUDE_EFFORT: "medium"
BOT_NAME: "Thyrocare Integration Assistant"
SUPPORT_CONTACT: "the Thyrocare integration team"
PUBLIC_URL: "https://<service url or custom domain>"   # used in email links

# Knowledge files and app data (users' chats, teams, sources, gaps, insights, cache): one bucket.
KNOWLEDGE_BACKEND: "gcs"
KNOWLEDGE_BUCKET: "<project>-assistant-knowledge"
KNOWLEDGE_PREFIX: "knowledge/"
DATA_BACKEND: "gcs"
DATA_PREFIX: "data/"
INTERNAL_TERMS_FILE: "/secrets/terms/internal_terms.txt"

# Sign-in: everyone with Google; company Workspace accounts are internal.
USER_LOGIN: "google"
GOOGLE_CLIENT_ID: "<client id>.apps.googleusercontent.com"
INTERNAL_DOMAINS: "pharmeasy.in,thyrocare.in"
ADMIN_EMAILS: "admin@yourcompany.com"           # super admins, comma separated
DEFAULT_TEAMS: "team-a:Team A,team-b:Team B"    # first teams (slug:Name); then managed on /admin

# Knowledge sources. In the cloud repos are read with a token (no personal git login there).
GITHUB_AUTH: "token"
GITHUB_ORGS: "pharmeasy"
GCHAT_TOKEN_FILE: "/secrets/gchat/token.json"
PRIVATE_NAMES_FILE: "/secrets/names/private_names.json"
GMAIL_TOKEN_FILE: "/secrets/gmail/gmail_token.json"

# Jobs: Cloud Scheduler calls POST /api/cron/tick (X-Cron-Secret) instead of the in-app timer.
SCHEDULER_ENABLED: "false"
SCHEDULE_TIMEZONE: "Asia/Kolkata"

TRUSTED_PROXY_HOPS: "1"                  # real client IP behind Cloud Run
BLOCK_BY_IP: "false"                     # with Google sign-in, block the account, not the office IP
RATE_LIMIT_PER_MINUTE: "8"
RATE_LIMIT_PER_HOUR: "60"
BLOCK_HOURS: "2"
MAX_CONCURRENT_ANSWERS: "20"
